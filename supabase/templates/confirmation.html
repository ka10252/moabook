<!--
  회원가입 인증 메일.

  메일 클라이언트(Gmail, Outlook, 네이버메일)는 <style> 태그와 최신 CSS를 자주 무시한다.
  그래서 table 레이아웃 + 인라인 스타일만 쓴다. flexbox·grid·CSS 변수는 쓰지 않는다.

  {{ .ConfirmationURL }} 은 Supabase가 실제 인증 링크로 바꿔준다.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F1EA;padding:40px 16px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:16px;padding:40px 32px;">

        <tr>
          <td align="center" style="padding-bottom:28px;">
            <div style="font-size:22px;font-weight:700;color:#2B2A28;letter-spacing:-0.5px;">MOA Book</div>
            <div style="font-size:13px;color:#8A857D;margin-top:4px;">함께 읽는 책장</div>
          </td>
        </tr>

        <tr>
          <td style="padding-bottom:12px;">
            <div style="font-size:20px;font-weight:700;color:#2B2A28;line-height:1.5;">
              이메일을 확인해주세요
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding-bottom:28px;">
            <div style="font-size:14px;color:#5C5852;line-height:1.7;word-break:keep-all;">
              MOA Book 가입을 시작하셨어요.<br />
              아래 버튼을 누르면 이웃의 책장이 열립니다.
            </div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#F26A4B;color:#ffffff;text-decoration:none;
                      font-size:15px;font-weight:700;padding:14px 36px;border-radius:12px;">
              이메일 인증하기
            </a>
          </td>
        </tr>

        <tr>
          <td style="padding-bottom:8px;">
            <div style="font-size:12px;color:#8A857D;line-height:1.6;word-break:keep-all;">
              버튼이 눌리지 않으면 아래 주소를 복사해 브라우저에 붙여넣어 주세요.
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:28px;">
            <div style="font-size:11px;color:#B5B0A8;word-break:break-all;line-height:1.5;">
              {{ .ConfirmationURL }}
            </div>
          </td>
        </tr>

        <tr>
          <td style="border-top:1px solid #EDE9E1;padding-top:20px;">
            <div style="font-size:12px;color:#B5B0A8;line-height:1.7;word-break:keep-all;">
              이 메일을 요청하지 않으셨다면 그냥 무시하셔도 괜찮아요.
              링크를 누르지 않으면 아무 일도 일어나지 않습니다.
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
