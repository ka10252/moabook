<!doctype html>
<html lang="ko">
  <head>

    <!-- Open Graph (카톡·텔레그램 공유 미리보기). og:image는 상대경로 — 대부분 크롤러가 페이지 URL 기준으로 해석.
         카카오 미리보기가 안 뜨면 배포 도메인으로 절대 URL(https://…/moa-logo.png)로 바꿀 것. 권장 규격 1200x630. -->
    <meta property="og:title" content="MOA | 함께 읽는 책장" />
    <meta property="og:description" content="싱가포르에서 이웃과 한국 책을 빌리고 나누고 사고파세요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MOA" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="/moa-logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MOA | 함께 읽는 책장" />
